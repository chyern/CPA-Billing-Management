name: Build plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: dylib
            cc: clang -arch arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
            cc: gcc
    runs-on: ${{ matrix.runner }}
    env:
      PLUGIN_ID: cpa-billing-management
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      EXTENSION: ${{ matrix.extension }}
      CC: ${{ matrix.cc }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" CC="${CC}" \
            go build -buildmode=c-shared \
            -o "dist/package/${PLUGIN_ID}.${EXTENSION}" ./cmd/plugin
          (cd dist/package && zip -9 "../${PLUGIN_ID}_${GOOS}_${GOARCH}.zip" "${PLUGIN_ID}.${EXTENSION}")

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ID }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.PLUGIN_ID }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error
