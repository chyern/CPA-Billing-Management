name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-darwin-arm64:
    runs-on: macos-14
    env:
      PLUGIN_ID: cpa-billing-management

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build and package Darwin arm64 plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="${PLUGIN_ID}_${version}_darwin_arm64.zip"
          mkdir -p dist/package
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="clang -arch arm64" \
            go build -buildmode=c-shared \
            -o "dist/package/${PLUGIN_ID}.dylib" ./cmd/plugin
          (cd dist/package && zip -9 "../${asset}" "${PLUGIN_ID}.dylib")
          (cd dist && shasum -a 256 "${asset}" > checksums.txt)
          rm -rf dist/package

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/cpa-billing-management_*_darwin_arm64.zip \
            dist/checksums.txt \
            --title "CPA Billing Management ${GITHUB_REF_NAME}" \
            --generate-notes
