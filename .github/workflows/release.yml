name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CGO_CFLAGS: -D_GNU_SOURCE

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH: ${RELEASE_VERSION}" >&2
            exit 1
          }

      - name: Test
        env:
          PLUGIN_VERSION: ${{ github.ref_name }}
        shell: bash
        run: go test -ldflags "-X main.pluginVersion=${PLUGIN_VERSION#v}" ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            extension: dylib
            cc: clang -arch arm64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
            cc: gcc
    runs-on: ${{ matrix.runner }}
    env:
      PLUGIN_ID: cpa-billing-management
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      EXTENSION: ${{ matrix.extension }}
      CC: ${{ matrix.cc }}
      CGO_CFLAGS: -D_GNU_SOURCE

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="${PLUGIN_ID}_${version}_${GOOS}_${GOARCH}.zip"
          mkdir -p dist/package
          CGO_ENABLED=1 GOOS="${GOOS}" GOARCH="${GOARCH}" CC="${CC}" \
            go build -ldflags "-X main.pluginVersion=${version}" -buildmode=c-shared \
            -o "dist/package/${PLUGIN_ID}.${EXTENSION}" ./cmd/plugin
          read -r -a cc_command <<< "${CC}"
          if [[ "${GOOS}" == "linux" ]]; then
            "${cc_command[@]}" -Wall -Wextra -Werror -o dist/abi-smoke tests/abi_smoke.c -ldl
          else
            "${cc_command[@]}" -Wall -Wextra -Werror -o dist/abi-smoke tests/abi_smoke.c
          fi
          dist/abi-smoke "dist/package/${PLUGIN_ID}.${EXTENSION}" "${version}"
          (cd dist/package && zip -9 "../${asset}" "${PLUGIN_ID}.${EXTENSION}")
          rm -rf dist/package

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ID }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.PLUGIN_ID }}_*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      PLUGIN_ID: cpa-billing-management

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.PLUGIN_ID }}-*
          path: dist
          merge-multiple: true

      - name: Calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          darwin_asset="dist/${PLUGIN_ID}_${version}_darwin_arm64.zip"
          linux_asset="dist/${PLUGIN_ID}_${version}_linux_amd64.zip"
          test -f "${darwin_asset}"
          test -f "${linux_asset}"
          (cd dist && sha256sum "$(basename "${darwin_asset}")" "$(basename "${linux_asset}")" | sort -k2 > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/${PLUGIN_ID}_*.zip \
              dist/checksums.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/${PLUGIN_ID}_*.zip \
              dist/checksums.txt \
              --verify-tag \
              --title "CPA Billing Management ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
