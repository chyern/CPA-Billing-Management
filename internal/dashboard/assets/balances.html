<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA 密钥余额</title>
  <style>{{STYLES}}</style>
</head>
<body class="balance-page">
  <header class="header">
    <div class="header-brand">
      <div class="header-top">
        <h1>CPA 密钥余额 <span class="title-badge">Balance</span></h1>
      </div>
      <div class="muted">为客户端 API Key 设置当前余额；新 usage 事件产生费用时会自动扣减，余额耗尽后的请求会在访问上游前被拦截。</div>
    </div>
    <div class="toolbar">
      <div class="status-wrap">
        <span id="statusDot" class="status-dot"></span>
        <span id="status" class="muted status"></span>
      </div>
    </div>
  </header>

  <main>
    <section id="balanceCards" class="grid grid-5"></section>
    <section class="panel rules-panel">
      <div class="rules-panel-header">
        <div>
          <h2>API Key 余额</h2>
          <p class="muted">仅显示 CLIProxyAPI 当前配置的 API Key，并保持配置顺序。留空表示不跟踪余额，完整密钥不会写入账单数据库。</p>
        </div>
        <div class="add-key-controls">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="balanceSearch" placeholder="搜索 Key 或备注...">
          </div>
          <button class="btn primary" id="addAPIKey">添加</button>
        </div>
      </div>
      <div id="balances" class="rules"></div>
    </section>
    <div id="toastContainer" class="cpa-toast-container"></div>
  </main>

  <footer class="footer">CPA Billing Management · 当前币种：<span id="currency"></span> · 未设置余额的密钥不拦截</footer>
  <script id="initial" type="application/json">{{INITIAL_JSON}}</script>
  <script>{{AUTH_SCRIPT}}</script>
  <script>{{PAGE_SCRIPT}}</script>
</body>
</html>
