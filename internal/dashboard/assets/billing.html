<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA 费用统计</title>
  <style>{{STYLES}}</style>
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-top">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div class="header-titles">
          <h1>CPA 费用统计 <span class="title-badge">Billing</span></h1>
          <div class="muted header-desc">实时监控 API 调用开销、Token 消耗分布与请求健康状况</div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="refresh-control">
        <svg class="refresh-control-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span class="muted">自动刷新</span>
        <select id="autoRefresh" aria-label="自动刷新">
          <option value="0">不刷新</option>
          <option value="5">5 秒</option>
          <option value="10">10 秒</option>
          <option value="15" selected>15 秒</option>
        </select>
      </div>
      <div class="status-wrap">
        <span id="statusDot" class="status-dot"></span>
        <span id="status" class="muted status"></span>
      </div>
    </div>
  </header>

  <main>
    <section class="panel query-panel">
      <div class="query-controls">
        <div class="quick-dates" id="quickDates">
          <button type="button" class="pill-btn active" data-days="0">今天</button>
          <button type="button" class="pill-btn" data-days="-1">昨天</button>
          <button type="button" class="pill-btn" data-days="7">近 7 天</button>
          <button type="button" class="pill-btn" data-days="30">近 30 天</button>
          <button type="button" class="pill-btn" data-days="all">全部</button>
        </div>
        <div class="date-inputs-wrap">
          <label class="field" for="startDate"><span>开始日期</span><input id="startDate" type="date"></label>
          <label class="field" for="endDate"><span>结束日期</span><input id="endDate" type="date"></label>
          <div class="query-actions">
            <button class="btn primary" id="query">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <span>查询</span>
            </button>
            <button class="btn" id="resetQuery">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>重置</span>
            </button>
          </div>
        </div>
      </div>
    </section>
    <section id="cards" class="grid"></section>
    <section class="panel">
      <div class="panel-heading">
        <h2>按模型汇总 <span class="count-badge" id="modelsCount"></span></h2>
        <div class="panel-actions">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="modelSearch" placeholder="搜索模型...">
          </div>
        </div>
      </div>
      <div id="models" class="table-responsive"></div>
    </section>
    <section class="panel">
      <div class="panel-heading">
        <h2>按 API Key 汇总 <span class="count-badge" id="keysCount"></span></h2>
        <div class="panel-actions">
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="keySearch" placeholder="搜索 API Key...">
          </div>
        </div>
      </div>
      <div id="apiKeys" class="table-responsive"></div>
    </section>
    <section class="panel">
      <div class="panel-heading">
        <h2>最近事件 <span class="count-badge" id="eventsCount"></span></h2>
        <div class="panel-actions">
          <div class="filter-pills" id="eventStatusFilter">
            <button type="button" class="filter-pill active" data-status="all">全部</button>
            <button type="button" class="filter-pill" data-status="success">仅成功</button>
            <button type="button" class="filter-pill" data-status="failed">仅失败</button>
          </div>
        </div>
      </div>
      <div id="events"></div>
    </section>
    <div id="toastContainer" class="cpa-toast-container"></div>
  </main>

  <footer class="footer">CPA Billing Management · 模型费用为估算值，请以供应商账单为准</footer>
  <script id="initial" type="application/json">{{INITIAL_JSON}}</script>
  <script>{{AUTH_SCRIPT}}</script>
  <script>{{PAGE_SCRIPT}}</script>
</body>
</html>
