<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA 模型费用</title>
  <style>{{STYLES}}</style>
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-top">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="header-titles">
          <h1>CPA 模型费用 <span class="title-badge">Pricing</span></h1>
          <div class="muted header-desc">配置各模型定价规则，支持从公共目录一键同步最新官方价格</div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <span id="status" class="muted status"></span>
    </div>
  </header>

  <main>
    <section class="panel sync-panel">
      <div class="panel-heading">
        <div>
          <h2>同步上游价格</h2>
        </div>
        <span class="pill neutral">可选渠道</span>
      </div>
      <div class="sync-controls">
        <label class="field" for="syncSource">
          <span>价格来源</span>
          <select id="syncSource" aria-label="价格来源">
            <option value="litellm">LiteLLM 公共目录</option>
            <option value="models.dev">Models.dev 公共目录</option>
            <option value="openrouter">OpenRouter 模型 API</option>
          </select>
        </label>
        <button class="btn primary" id="sync">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
          <span>获取价格差异</span>
        </button>
      </div>
    </section>

    <section class="panel catalog-panel" hidden>
      <div class="panel-heading">
        <div>
          <h2>可用模型目录</h2>
          <p class="muted">与 CLIProxyAPI 首页“模型”卡片相同，列出当前代理端点暴露的模型；未配置价格的模型按 0 展示。</p>
        </div>
      </div>
      <div id="catalog" class="rules"></div>
    </section>

    <section class="panel rules-panel">
      <div class="rules-panel-header">
        <div>
          <h2>模型价格规则</h2>
          <p class="muted">匹配优先级：模型名 → alias → *。价格单位为当前币种 / 1M token，费用在事件生成时计算，后续修改价格不会影响历史事件。</p>
        </div>
        <div class="actions">
          <div class="rules-search-wrap">
            <input type="text" id="ruleSearch" placeholder="按模型名称或通配快速过滤...">
          </div>
          <button class="btn" id="add">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>新增规则</span>
          </button>
          <button class="btn primary" id="save">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span>保存模型费用</span>
          </button>
        </div>
      </div>
      <div id="rules" class="rules"></div>
    </section>
    <div id="toastContainer" class="cpa-toast-container"></div>
  </main>

  <footer class="footer">CPA Billing Management · 当前币种：<span id="currency"></span> · 估算费用仅供参考</footer>
  <script id="initial" type="application/json">{{INITIAL_JSON}}</script>
  <script>{{AUTH_SCRIPT}}</script>
  <script>{{PAGE_SCRIPT}}</script>
</body>
</html>
